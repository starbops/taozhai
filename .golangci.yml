version: "2"

linters:
  default: standard
  enable:
    # Bug detection
    - errcheck           # Checks for unchecked errors
    - govet              # Reports suspicious constructs
    - staticcheck        # Comprehensive static analysis (includes gosimple, stylecheck)

    # Security
    - gosec              # Security-oriented linting

    # Style and simplification
    - unconvert          # Remove unnecessary type conversions
    - unparam            # Reports unused function parameters

    # Performance
    - ineffassign        # Detects ineffectual assignments

    # Code quality
    - misspell           # Finds commonly misspelled words
    - gocyclo            # Cyclomatic complexity checker
    - dupl               # Code clone detection
    - goconst            # Finds repeated strings that could be constants
  disable:
    - revive             # Disabled: too many false positives for Ginkgo/Gomega projects

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable-all: true
  gocyclo:
    min-complexity: 15
  gosec:
    excludes: []

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

exclusions:
  presets:
    - comment
    - std-error-handling
  rules:
    # Exclude test files from certain checks
    - linters:
        - dupl
        - gocyclo
      path: _test\.go$

run:
  timeout: 5m
  modules-download-mode: readonly

output:
  formats:
    colored-line-number: {}
  sort-results: true
